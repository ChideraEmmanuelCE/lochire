name: LocHire auth UI checks

on:
  push:
    branches: [ui/auth-refresh, main]
  pull_request:
    paths:
      - app.js
      - auth.css
      - index.html
      - tests/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the UI
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and check syntax
        run: npm run build
      - name: Run frontend tests
        run: npm test
